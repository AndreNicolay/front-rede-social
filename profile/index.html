<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - SocialApp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <h1 class="logo">SocialApp</h1>
    <nav>
      <a href="../index.html">Início</a>
      <a href="../new-post/index.html">Nova postagem</a>
      <a href="../direct/index.html">Direct</a>
      <button id="logout-btn">Sair</button>
    </nav>
  </header>

  <main class="profile-main">
    <section class="profile-header">
      <button id="avatarTrigger" class="avatar-trigger" type="button" aria-label="Alterar foto de perfil">
        <img id="avatar" class="avatar-grande" src="" alt="avatar">
      </button>

      <div>
        <h2 id="username"></h2>
        <p id="name"></p>
        <p id="post-count"></p>
        <button id="follow-btn">Seguir</button>
        <button id="message-btn">Mensagem</button>
      </div>
    </section>

    <div id="grid" class="posts-grid">
      <p class="loading">Carregando posts...</p>
    </div>
  </main>

  <div id="avatarModal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="avatarModalTitle">
      <div class="modal-header">
        <h3 id="avatarModalTitle">Foto de perfil</h3>
        <button id="closeAvatarModalBtn" class="close-btn" type="button" aria-label="Fechar modal">&times;</button>
      </div>

      <div class="modal-body">
        <div class="avatar-preview-wrap">
          <img id="avatarPreview" class="avatar-preview" src="" alt="Pré-visualização da foto de perfil">
        </div>

        <label for="avatarInput" class="modal-btn upload-btn">Escolher imagem</label>
        <input id="avatarInput" type="file" accept="image/*" hidden>

        <div class="modal-actions">
          <button id="removeAvatarBtn" class="modal-btn danger-btn" type="button">Remover foto</button>
          <button id="cancelAvatarBtn" class="modal-btn secondary-btn" type="button">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script type="module" src="data.js"></script>
</body>
</html>
