<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha</title>
    <link rel="stylesheet" href="../login/style.css">
</head>
<body>
    
    <div class="auth-box">
        <h1 class="logo">SocialApp</h1>

        <form id="redefinicao-form">
            <input type="email" id="email" placeholder="E-mail" required readonly disabled>
            <input type="password" id="nova-senha" placeholder="Nova Senha" required>
            <button type="submit">Redefinir Senha</button>
            <p id="erro" class="erro"></p>
        </form>

        <p class="troca"><a href="../login/index.html">Logar</a></p>
  </div>

  <script src="script.js"></script>
  <script type="module" src="data.js"></script>
</body>
</html>
